name: Verificador de Lineas QA
on:
  push:
    branches:
      - 'verificadores/**'
    paths:
      - 'verificadores/verificador-de-lineas/**'
      - '.github/workflows/verificador-lineas-qa.yml'
  pull_request:
    paths:
      - 'verificadores/verificador-de-lineas/**'
      - '.github/workflows/verificador-lineas-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: verificadores/verificador-de-lineas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node --test tests/core.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps firefox
      - run: node --test tests/browser.test.mjs
